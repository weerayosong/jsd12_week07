<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <h1 id="jsdTag">JSD12</h1>
        <p class="jsdPara">This is paragraph 1</p>
        <p class="jsdPara">This is paragraph 2</p>
        <p class="jsdPara">This is paragraph 3</p>
        <a id="jsdA">This is paragraph A</a>
        <a id="bB"
            >This is paragraph B
            <span style="display: none">Javascript</span></a
        >
        <h2>------------------------</h2>
        <p id="myMessage">
            <i style="color: #f00">I'm back! Change me if you dare! 😈</i>
        </p>
        <button id="myButton">Click me!</button>

        <h2>------------------------</h2>
        <p>Counter ++ 😎</p>
        <h1 id="countDisplay">0</h1>
        <button onclick="increaseCounter()">+ Add me! 😈</button>

        <h2>------------------------</h2>

        <script>
            // play with DOM
            const jsdH1 = document.getElementById('jsdTag');
            console.log(jsdH1);
            const jsdP = document.getElementsByClassName('jsdPara');
            console.log(jsdP);
            const jsdTag = document.getElementsByTagName('a');
            console.dir(jsdTag);
            jsdH1.innerText = 'Black Pink';
            console.log(jsdH1.innerHTML);
            jsdH1.style.color = '#f8a';
            jsdH1.style.backgroundColor = '#444';
            jsdH1.style.fontWeight = '700';

            const jsdBB = document.getElementById('bB');
            console.log(jsdBB.textContent);
            console.log(jsdBB.innerText);
            console.log(jsdBB.innerHTML);

            //Change innerText with btn
            const buttonElement = document.getElementById('myButton');
            const textElement = document.getElementById('myMessage');

            buttonElement.addEventListener('click', function () {
                textElement.innerText = 'I changed you now evil Emoji 🎉';
                textElement.style.color = '#0FF';
                textElement.style.backgroundColor = '#444';
                textElement.style.fontWeight = 'bold';
            });

            // counter++ btn | only onClick
            let count = 0;
            function increaseCounter() {
                count++;
                document.getElementById('countDisplay').innerText = count;
            }
        </script>
    </body>
</html>
